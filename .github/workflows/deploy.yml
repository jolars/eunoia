name: Deploy to Cloudflare Workers

on:
  # Deploy only on releases. Versionary pushes a `v*` tag (the crate release)
  # for each release; the npm tag is `eunoia-npm-v*`, which this does not match,
  # so a release deploys the site exactly once. Use the manual trigger below for
  # out-of-band redeploys (e.g. urgent doc fixes between releases).
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-workers"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          targets: wasm32-unknown-unknown
          toolchain: 1.88.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build WASM and prepare npm package
        run: |
          wasm-pack build crates/eunoia-wasm --target bundler --out-dir ${{ github.workspace }}/npm
          node ts/prepare-package.mjs
          ls -la npm/

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Build web app
        run: pnpm run build
        working-directory: web

      - name: Test Markdown negotiation
        run: pnpm run test:markdown
        working-directory: web

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy --config cloudflare/wrangler.jsonc
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
